version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR a week for everything that should be safe; majors stay separate.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(docker)
    ignore:
      # Node majors are a deliberate upgrade (engines, CI, docs move together).
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(docker)
    ignore:
      # A new PostgreSQL major needs a dump and restore (docs/deploy/backup.md).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
