version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR a week for everything that should be safe.
      minor-and-patch:
        update-types: [minor, patch]
      # Majors arrive together in a second PR, so coupled ones (jest and
      # ts-jest) move as a pair. If CI fails, comment
      # "@dependabot ignore <name> major version" to drop the culprit.
      majors:
        update-types: [major]
    ignore:
      # Types for the Node.js runtime: they move with the Dockerfile's
      # node:22-alpine, CI's node-version and engines (checked by
      # tests/unit/packaging/config-docs.test.ts), never ahead of them.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Deliberate migrations with code changes, not weekly updates.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      # Waits for typescript-eslint's and eslint-config-next's peer ranges.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # v4 moves its PostCSS plugin and configuration (postcss.config.js,
      # tailwind.config.ts).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # 7 is outside ts-jest's and typescript-eslint's peer ranges.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(docker)
    ignore:
      # Node majors are a deliberate upgrade (engines, CI, docs move together).
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(docker)
    ignore:
      # A new PostgreSQL major needs a dump and restore (docs/deploy/backup.md).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
